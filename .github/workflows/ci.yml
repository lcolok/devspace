name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lifecycle-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/worktree-lifecycle-gc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: feat/worktree-lifecycle-gc
          fetch-depth: 0

      - name: Insert close_workspace registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/server.ts")
          text = path.read_text()
          if '"close_workspace"' in text:
              print("close_workspace already present; nothing to patch")
              raise SystemExit(0)

          marker = "  registerAppTool(\n    server,\n    toolNames.read,\n"
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one read-tool marker, got {text.count(marker)}")

          block = "\n".join([
              "  registerAppTool(",
              "    server,",
              "    \"close_workspace\",",
              "    {",
              "      title: \"Close workspace\",",
              "      description:",
              "        \"Release an open workspace when work in it is finished. This closes only the DevSpace workspace lease: it never deletes project files or a managed Git worktree. Managed worktrees are preserved for later conservative GC. The call is refused while a DevSpace process session is still running for the workspace.\",",
              "      inputSchema: {",
              "        workspaceId: z",
              "          .string()",
              "          .describe(\"Workspace identifier returned by open_workspace.\"),",
              "      },",
              "      outputSchema: {",
              "        workspaceId: z.string(),",
              "        root: z.string(),",
              "        mode: z.enum([\"checkout\", \"worktree\"]),",
              "        status: z.literal(\"released\"),",
              "        worktreePreserved: z.boolean(),",
              "        instruction: z.string(),",
              "      },",
              "      annotations: {",
              "        readOnlyHint: false,",
              "        destructiveHint: false,",
              "        idempotentHint: false,",
              "        openWorldHint: false,",
              "      },",
              "    },",
              "    async ({ workspaceId }) => {",
              "      const startedAt = performance.now();",
              "      if (processSessions.hasRunningForWorkspace(workspaceId)) {",
              "        throw new Error(",
              "          `Cannot close workspace ${workspaceId} while it has a running process session. Finish or stop the process first.`,",
              "        );",
              "      }",
              "",
              "      const released = workspaces.releaseWorkspace(workspaceId);",
              "      const instruction = released.worktreePreserved",
              "        ? \"Workspace released. Its managed worktree was preserved and may be reclaimed later only by the conservative workspace GC policy.\"",
              "        : \"Workspace released. No project files were deleted.\";",
              "      logToolCall(config, {",
              "        tool: \"close_workspace\",",
              "        workspaceId,",
              "        path: released.root,",
              "        success: true,",
              "        durationMs: Math.round(performance.now() - startedAt),",
              "      });",
              "",
              "      return {",
              "        content: [",
              "          {",
              "            type: \"text\" as const,",
              "            text: [",
              "              `Released workspace ${workspaceId}.`,",
              "              `Root: ${released.root}`,",
              "              `Mode: ${released.mode}`,",
              "              instruction,",
              "            ].join(\"\\n\"),",
              "          },",
              "        ],",
              "        structuredContent: {",
              "          ...released,",
              "          instruction,",
              "        },",
              "      };",
              "    },",
              "  );",
              "",
              "",
          ])
          path.write_text(text.replace(marker, block + marker, 1))
          PY

          if git diff --quiet -- src/server.ts; then
            exit 0
          fi
          git config user.name "devspace-lifecycle-bot"
          git config user.email "devspace-lifecycle-bot@users.noreply.github.com"
          git add src/server.ts
          git diff --cached --check
          git commit -m "feat(workspace): expose close workspace lifecycle"
          git push origin HEAD:feat/worktree-lifecycle-gc

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor
