name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lifecycle-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/worktree-lifecycle-gc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout lifecycle branch
        uses: actions/checkout@v4
        with:
          ref: feat/worktree-lifecycle-gc
          fetch-depth: 0

      - name: Add required MCP app metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/server.ts")
          text = path.read_text()
          old = "        worktreePreserved: z.boolean(),\n        instruction: z.string(),\n      },\n      annotations: {\n"
          new = "        worktreePreserved: z.boolean(),\n        instruction: z.string(),\n      },\n      _meta: {},\n      annotations: {\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one close_workspace metadata insertion point, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "devspace-lifecycle-bot"
          git config user.email "devspace-lifecycle-bot@users.noreply.github.com"
          git add src/server.ts
          git diff --cached --check
          git commit -m "fix(workspace): add close tool app metadata"
          git push origin HEAD:feat/worktree-lifecycle-gc

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor
