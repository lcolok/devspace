name: Apply workspace lifecycle server patch

on:
  push:
    branches:
      - feat/worktree-lifecycle-gc
    paths:
      - .github/workflows/apply-workspace-close-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worktree-lifecycle-gc
          fetch-depth: 0

      - name: Insert close_workspace registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/server.ts")
          text = path.read_text()
          marker = '''  registerAppTool(
            server,
            toolNames.read,
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one read-tool marker, got {text.count(marker)}")

          block = '''  registerAppTool(
            server,
            "close_workspace",
            {
              title: "Close workspace",
              description:
                "Release an open workspace when work in it is finished. This only closes the DevSpace workspace lease: it never deletes project files or a managed Git worktree. Managed worktrees are preserved for later conservative GC. The call is refused while a DevSpace process session is still running for the workspace.",
              inputSchema: {
                workspaceId: z
                  .string()
                  .describe("Workspace identifier returned by open_workspace."),
              },
              outputSchema: {
                workspaceId: z.string(),
                root: z.string(),
                mode: z.enum(["checkout", "worktree"]),
                status: z.literal("released"),
                worktreePreserved: z.boolean(),
                instruction: z.string(),
              },
              annotations: {
                readOnlyHint: false,
                destructiveHint: false,
                idempotentHint: false,
                openWorldHint: false,
              },
            },
            async ({ workspaceId }) => {
              const startedAt = performance.now();
              if (processSessions.hasRunningForWorkspace(workspaceId)) {
                throw new Error(
                  `Cannot close workspace ${workspaceId} while it has a running process session. Finish or stop the process first.`,
                );
              }

              const released = workspaces.releaseWorkspace(workspaceId);
              const instruction = released.worktreePreserved
                ? "Workspace released. Its managed worktree was preserved and may be reclaimed later only by the conservative workspace GC policy."
                : "Workspace released. No project files were deleted.";
              logToolCall(config, {
                tool: "close_workspace",
                workspaceId,
                path: released.root,
                success: true,
                durationMs: Math.round(performance.now() - startedAt),
              });

              return {
                content: [
                  {
                    type: "text" as const,
                    text: [
                      `Released workspace ${workspaceId}.`,
                      `Root: ${released.root}`,
                      `Mode: ${released.mode}`,
                      instruction,
                    ].join("\\n"),
                  },
                ],
                structuredContent: {
                  ...released,
                  instruction,
                },
              };
            },
          );

          '''
          path.write_text(text.replace(marker, block + marker, 1))
          PY

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/apply-workspace-close-patch.yml
          git config user.name "devspace-lifecycle-bot"
          git config user.email "devspace-lifecycle-bot@users.noreply.github.com"
          git add src/server.ts
          git diff --cached --check
          git commit -m "feat(workspace): expose close workspace lifecycle"
          git push origin HEAD:feat/worktree-lifecycle-gc
